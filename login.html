<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – Aerologic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@100;400;700;800&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="navbar">
    <div class="navbar-logo">
      <img src="assets/logo-blue.png" alt="Logo">
      <img src="assets/logo-name-text.png" alt="Aerologic">
    </div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="lessons.html">Lessons</a>
      <a href="myprogress.html">My Progress</a>
    </div>
    <div class="navbar-right" id="navbar-right">
      <a href="signup.html" class="signup-btn">Sign up</a>
    </div>
  </div>

  <section class="auth-section">
    <div class="auth-card">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Continue your virtual flight journey.</p>

      <div class="auth-error hidden" id="auth-error"></div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn-auth" id="login-btn">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('auth-error');
      const btn = document.getElementById('login-btn');
      errorEl.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'myprogress.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        btn.textContent = 'Log In';
        btn.disabled = false;
      }
    });
  </script>
  <script src="navbar.js"></script>
</body>
</html>
